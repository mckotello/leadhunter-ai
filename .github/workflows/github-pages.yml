name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cloud API URL (optional)
        env:
          LEADHUNTER_API_URL: ${{ secrets.LEADHUNTER_API_URL }}
        run: |
          if [ -n "$LEADHUNTER_API_URL" ]; then
            echo "window.LeadHunterPublicConfig={apiBase:'${LEADHUNTER_API_URL}'};" > frontend/assets/js/config.public.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
