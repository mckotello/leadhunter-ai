<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лиды — LeadHunter AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">LeadHunter AI</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="/search.html">Поиск</a>
        <a class="nav-link active" href="/leads.html">Лиды</a>
        <a class="nav-link" href="/presentation.html">Проверка</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">База лидов</h1>
      <a class="btn btn-outline-secondary btn-sm" href="/api/export?format=csv">Экспорт CSV</a>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input id="filter-q" class="form-control" placeholder="Поиск по названию" />
      </div>
      <div class="col-md-3">
        <select id="filter-status" class="form-select">
          <option value="">Все статусы</option>
          <option value="new">Новый</option>
          <option value="analyzed">Проанализирован</option>
          <option value="qualified">Квалифицирован</option>
          <option value="in_progress">В работе</option>
          <option value="contacted">Контакт установлен</option>
          <option value="rejected">Отказ</option>
          <option value="client">Клиент</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" id="filter-apply">Применить</button>
      </div>
    </div>

    <div class="table-responsive card shadow-sm">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Компания</th>
            <th>Ниша</th>
            <th>Потребность</th>
            <th>Score</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody id="leads-table"></tbody>
      </table>
    </div>
  </main>

  <script src="assets/js/config.public.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    LeadHunter.loadLeadsTable();
  </script>
</body>
</html>
