<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeadHunter AI — проверка системы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/styles.css" rel="stylesheet" />
  <style>
    .slide-deck { min-height: 70vh; }
    .slide { display: none; }
    .slide.active { display: block; }
    .slide pre { background: #f1f3f5; padding: 1rem; border-radius: 6px; font-size: 0.85rem; }
    .progress-label { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">LeadHunter AI</a>
      <span class="navbar-text text-white-50">Проверка системы</span>
    </div>
  </nav>

  <main class="container py-4 slide-deck">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0" id="slide-title">LeadHunter AI</h1>
      <span class="progress-label text-muted" id="slide-counter">1 / 8</span>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body" id="slide-body"></div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-between">
      <div>
        <button type="button" class="btn btn-outline-secondary" id="btn-prev">Назад</button>
        <button type="button" class="btn btn-primary" id="btn-next">Далее</button>
      </div>
      <div class="btn-group flex-wrap" id="slide-dots" role="group"></div>
    </div>
  </main>

  <script>
    const SLIDES = [
      {
        title: "LeadHunter AI",
        html: `<p class="text-muted">Как проверить систему перед демо и продакшеном</p>
<ul>
<li>MVP: поиск → парсинг → AI-анализ → скоринг → CRM → экспорт</li>
<li>Слои: автотесты → Docker → ручной сценарий → интеграции</li>
<li>Mock-поиск локально; SerpAPI и LLM — для боевого прогона</li>
</ul>`
      },
      {
        title: "Четыре уровня проверки",
        html: `<div class="table-responsive"><table class="table table-sm">
<thead><tr><th>Уровень</th><th>Что</th><th>Время</th><th>Действие</th></tr></thead>
<tbody>
<tr><td>1. Unit / API</td><td>SSRF, скоринг, агенты, CORS, Celery</td><td>~5 мин</td><td><code>pytest</code></td></tr>
<tr><td>2. Инфра</td><td>Postgres, Redis, API, worker, nginx</td><td>~10 мин</td><td><code>docker compose up</code></td></tr>
<tr><td>3. E2E UI</td><td>Поиск → лиды → карточка → КП → CSV</td><td>~15 мин</td><td>:8080</td></tr>
<tr><td>4. Интеграции</td><td>SerpAPI, Ollama, реальные сайты</td><td>опционально</td><td><code>.env</code></td></tr>
</tbody></table></div>`
      },
      {
        title: "Автотесты (pytest)",
        html: `<p class="text-muted">26 тестов — быстрый регресс</p>
<pre>cd backend
python -m venv .venv
.venv\\Scripts\\activate
pip install -r requirements.txt
pytest -q</pre>
<p><strong>Безопасность:</strong> test_ssrf.py<br>
<strong>Логика:</strong> test_scoring, test_agents, test_core<br>
<strong>API:</strong> test_api, test_cors, test_celery</p>`
      },
      {
        title: "Docker Compose",
        html: `<pre>cp .env.example .env
docker compose up --build</pre>
<ul>
<li><a href="/">/</a> — UI</li>
<li><a href="/docs">/docs</a> — Swagger (через nginx proxy)</li>
<li><a href="/health">/health</a> — API health</li>
<li><code>docker compose ps</code> — все сервисы healthy</li>
<li>Логи worker: <code>search.run_pipeline</code></li>
</ul>`
      },
      {
        title: "Демо-сценарий MVP",
        html: `<ol>
<li>Поиск: «оптовая торговля», «Москва», limit 20</li>
<li>Статус задачи <strong>completed</strong></li>
<li>Лиды — сортировка по score</li>
<li>Карточка: анализ, score, статус</li>
<li>Черновик КП (без автоотправки)</li>
<li>Экспорт: <a href="/api/export?format=csv">/api/export?format=csv</a></li>
</ol>`
      },
      {
        title: "Проверка через API",
        html: `<pre>POST /api/search
{"niche":"опт","region":"Москва","need_type":"other","limit":5}

GET /api/search/{id}
GET /api/leads
PATCH /api/leads/{id}
POST /api/leads/{id}/analyze
POST /api/leads/{id}/offer
GET /api/dashboard</pre>`
      },
      {
        title: "Безопасность и качество",
        html: `<ul>
<li>Redirect: валидация каждого hop, блок private IP</li>
<li>DNS rebinding: повторная резолюция перед запросом</li>
<li>CORS: <code>CORS_ORIGINS</code>, не * + credentials</li>
<li>Скоринг: полнота intel, не «есть сайт»</li>
<li>SerpAPI / LLM: логирование ошибок, fallback только для LLM</li>
</ul>`
      },
      {
        title: "Чеклист перед показом",
        html: `<ul class="list-unstyled">
<li><input type="checkbox" disabled> pytest — все зелёные</li>
<li><input type="checkbox" disabled> docker compose — healthy</li>
<li><input type="checkbox" disabled> mock-поиск — лиды в таблице</li>
<li><input type="checkbox" disabled> LLM или осознанный fallback</li>
<li><input type="checkbox" disabled> CSV в Excel</li>
<li><input type="checkbox" disabled> CORS_ORIGINS = URL фронта</li>
</ul>
<p class="small text-muted">Подробности: docs/verification-guide.md в репозитории</p>`
      }
    ];

    let index = 0;
    const titleEl = document.getElementById("slide-title");
    const bodyEl = document.getElementById("slide-body");
    const counterEl = document.getElementById("slide-counter");
    const dotsEl = document.getElementById("slide-dots");

    function render() {
      const s = SLIDES[index];
      titleEl.textContent = s.title;
      bodyEl.innerHTML = s.html;
      counterEl.textContent = `${index + 1} / ${SLIDES.length}`;
      dotsEl.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("btn-primary", i === index);
        btn.classList.toggle("btn-outline-secondary", i !== index);
      });
    }

    SLIDES.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-sm btn-outline-secondary";
      b.textContent = String(i + 1);
      b.onclick = () => { index = i; render(); };
      dotsEl.appendChild(b);
    });

    document.getElementById("btn-prev").onclick = () => {
      index = Math.max(0, index - 1);
      render();
    };
    document.getElementById("btn-next").onclick = () => {
      index = Math.min(SLIDES.length - 1, index + 1);
      render();
    };
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") document.getElementById("btn-prev").click();
      if (e.key === "ArrowRight") document.getElementById("btn-next").click();
    });
    render();
  </script>
</body>
</html>
