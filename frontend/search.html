<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Поиск — LeadHunter AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">LeadHunter AI</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link active" href="/search.html">Поиск</a>
        <a class="nav-link" href="/leads.html">Лиды</a>
        <a class="nav-link" href="/presentation.html">Проверка</a>
      </div>
    </div>
  </nav>

  <main class="container col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header">Новая поисковая задача</div>
      <div class="card-body">
        <form id="search-form" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Ниша</label>
            <input class="form-control" name="niche" required placeholder="Оптовая торговля" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Регион</label>
            <input class="form-control" name="region" required placeholder="Москва" />
          </div>
          <div class="col-12">
            <label class="form-label">Ключевые слова</label>
            <input class="form-control" name="keywords" placeholder="каталог, b2b" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Тип потребности</label>
            <select class="form-select" name="need_type">
              <option value="personal_account">Личный кабинет</option>
              <option value="ecommerce">Интернет-магазин</option>
              <option value="automation">Автоматизация</option>
              <option value="crm_integration">CRM</option>
              <option value="website">Сайт</option>
              <option value="telegram_bot">Telegram-бот</option>
              <option value="ai">AI</option>
              <option value="other">Другое</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Количество компаний</label>
            <input class="form-control" type="number" name="limit" min="1" max="200" value="20" />
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Начать поиск</button>
          </div>
        </form>
        <div id="search-status" class="alert alert-info mt-3 d-none"></div>
      </div>
    </div>
  </main>

  <script src="/assets/js/app.js"></script>
  <script>
    LeadHunter.initSearchForm();
  </script>
</body>
</html>
